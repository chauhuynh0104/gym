        // Lưu trữ trạng thái kết quả của từng câu
        let userAnswers = {};

        // Hàm xáo trộn mảng
        function shuffleArray(array) {
            let shuffled = JSON.parse(JSON.stringify(array));
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Khởi tạo giao diện
        function initQuiz() {
            userAnswers = {};
            updateScoreBoard();

            const quizContainer = document.getElementById('quiz-container');
            quizContainer.innerHTML = '';

            // Random câu hỏi
                        // Random câu hỏi (chỉ khi toggle đang bật)
            const isRandomOn = document.getElementById('random-toggle').checked;
            const shuffledQuestions = isRandomOn ? shuffleArray(rawQuestions) : rawQuestions;

            shuffledQuestions.forEach((item, qIndex) => {
                const card = document.createElement('div');
                card.className = 'question-card';

                // Tiêu đề câu hỏi
                const qTitle = document.createElement('div');
                qTitle.className = 'question-text';
                qTitle.innerText = `${qIndex + 1}. ${item.q.replace(/^Câu \d+\.\s*/, '')}`;
                card.appendChild(qTitle);

                // Danh sách đáp án
                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options-container';

                // Random đáp án
                const shuffledOptions = shuffleArray(item.options);
                const labels = ['A', 'B', 'C', 'D'];

                shuffledOptions.forEach((opt, oIndex) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    const cleanText = opt.text.replace(/^[A-D]\.\s*/, '');
                    btn.innerText = `${labels[oIndex]}. ${cleanText}`;
                    
                    // Xử lý khi nhấn chọn đáp án (có thể chọn lại)
                    btn.onclick = () => selectOption(qIndex, btn, opt.isCorrect, optionsDiv, card);
                    optionsDiv.appendChild(btn);
                });

                card.appendChild(optionsDiv);

                // Khung thông báo đúng/sai
                const feedbackDiv = document.createElement('div');
                feedbackDiv.className = 'feedback';
                card.appendChild(feedbackDiv);

                quizContainer.appendChild(card);
            });
        }

        // Xử lý khi chọn/đổi đáp án
        function selectOption(qIndex, selectedBtn, isCorrect, optionsContainer, card) {
            const buttons = optionsContainer.querySelectorAll('.option-btn');
            
            // Xóa màu cũ trên tất cả các đáp án của câu này
            buttons.forEach(btn => {
                btn.classList.remove('correct', 'wrong');
            });

            const feedbackDiv = card.querySelector('.feedback');

            // Cập nhật giao diện theo lựa chọn mới
            if (isCorrect) {
                selectedBtn.classList.add('correct');
                feedbackDiv.innerText = "✓ Chính xác!";
                feedbackDiv.style.color = "#155724";
                userAnswers[qIndex] = true; // Lưu trạng thái: Đúng
            } else {
                selectedBtn.classList.add('wrong');
                feedbackDiv.innerText = "✗ Chưa đúng! Bạn có thể chọn lại đáp án khác.";
                feedbackDiv.style.color = "#721c24";
                userAnswers[qIndex] = false; // Lưu trạng thái: Sai
            }

            // Cập nhật lại điểm số tổng
            updateScoreBoard();
        }

        // Cập nhật thanh điểm số
        function updateScoreBoard() {
            const answeredCount = Object.keys(userAnswers).length;
            const correctCount = Object.values(userAnswers).filter(val => val === true).length;

            document.getElementById('score').innerText = correctCount;
            document.getElementById('total-answered').innerText = answeredCount;
        }

         // Chạy khi mở trang
        window.onload = function() {
            const toggle = document.getElementById('random-toggle');
            // Đọc trạng thái đã lưu — mặc định TẮT nếu chưa từng lưu
            toggle.checked = localStorage.getItem('randomQuestionsEnabled') === 'true';
            // Mỗi khi bật/tắt: lưu lại + làm lại bài theo trạng thái mới
            toggle.addEventListener('change', () => {
                localStorage.setItem('randomQuestionsEnabled', toggle.checked);
                initQuiz();
            });
            initQuiz();
        };
    </script>
</body>
</html>
